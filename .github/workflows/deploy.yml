name: publicar imagen en dockerhub

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  

jobs: 
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descagar codigo
        uses: actions/checkout@v3

      - name: Configuarar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit
          
      - name: Escaneo de seguriad (bandit)
        run: bandit -r . -s B101

      - name: Ejecutar pruebas pytest
        run: pytest
        
        
  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descagar codigo
        uses: actions/checkout@v3
      
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name:  Construir imagen 
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: cristhianpa22/evidencia-2-docker:latest

      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cristhianpa22/evidencia-2-docker:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir la imagen a Docker Hub
        run: docker push cristhianpa22/evidencia-2-docker:latest
         
      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST}}
          username: ${{ secrets.SERVER_USER}}
          key: ${{ secrets.SERVER_SSH_KEY}}
          script: |
            cd ~/evidencia-2-docker
            docker compose pull app_backend
            docker compose up -d --force-recreate app_backend
            


  
